name: "Build ECH native lib (libhan1me_ech.so)"

# 自编 libhan1me_ech.so —— 不再依赖别人预编译的包。
# 起因（2026-09-11）：外部编译的 .so 里 FOLLOWLOCATION=1 + header_callback 清头 + 无 cookie jar，
# 导致 AO3 登录成功的 302 Set-Cookie 被吃掉、登录态永远同步不回来。
# 源码已在仓库 c/ssl/（native-lib.cpp + CMakeLists.txt），改完这里一键重编。

on:
  workflow_dispatch:
    inputs:
      curl_tag:
        description: "curl 源码 tag"
        required: false
        default: "curl-8_22_0"
      abi:
        description: "目标 ABI"
        required: false
        default: "arm64-v8a"
  push:
    paths:
      - 'c/ssl/**'
      - '.github/workflows/build-ech-lib.yml'

permissions:
  contents: write

jobs:
  build-ech-lib:
    name: Build libhan1me_ech.so
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.1.12297006"
      # 固定 boringssl commit：ECH 相关的 SSL_set1_ech_config_list 依赖上游实现，
      # 不 pin 的话上游一改就可能编不过或行为变化。
      BORINGSSL_SHA: "2b60ed4ed5bd9b3c99eec9b579ad331a6a3c5d92"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;$NDK_VERSION"

      - name: Cache boringssl/curl install tree
        uses: actions/cache@v4
        with:
          path: c/ssl/build/install
          key: echlib-install-${{ env.BORINGSSL_SHA }}-${{ inputs.curl_tag || 'curl-8_22_0' }}-${{ env.NDK_VERSION }}

      - name: Fetch boringssl + curl sources
        run: |
          set -e
          mkdir -p c/ssl/lib
          if [ ! -d c/ssl/lib/boringssl/.git ]; then
            git clone -q https://github.com/google/boringssl.git c/ssl/lib/boringssl
          fi
          git -C c/ssl/lib/boringssl fetch -q --depth 1 origin "$BORINGSSL_SHA" || true
          git -C c/ssl/lib/boringssl checkout -q "$BORINGSSL_SHA"
          echo "boringssl: $(git -C c/ssl/lib/boringssl rev-parse HEAD)"
          if [ ! -d c/ssl/lib/curl/.git ]; then
            git clone -q --depth 1 --branch "${{ inputs.curl_tag || 'curl-8_22_0' }}" https://github.com/curl/curl.git c/ssl/lib/curl
          fi
          echo "curl: $(git -C c/ssl/lib/curl describe --tags 2>/dev/null || git -C c/ssl/lib/curl rev-parse HEAD)"

      - name: Configure + build
        env:
          ABI: ${{ inputs.abi || 'arm64-v8a' }}
        run: |
          set -e
          cmake -S c/ssl -B c/ssl/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build c/ssl/build --target han1me_ech -j4

      - name: Verify .so (ABI + JNI 符号 + 关键修复)
        env:
          ABI: ${{ inputs.abi || 'arm64-v8a' }}
        run: |
          set -e
          SO=c/ssl/build/libhan1me_ech.so
          ls -la "$SO"
          file "$SO"
          TOOLCHAIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLCHAIN/llvm-readelf" -h "$SO" | grep -E "Machine|Class"
          echo "JNI symbols: $("$TOOLCHAIN/llvm-nm" -D "$SO" | grep -c 'Java_com_liar_han1meplus_EchHttpClient' || true)"
          # 交付前断言：这次必须没有跟随重定向的调用残留（我们改成 0L 就是为了它）
          if "$TOOLCHAIN/llvm-objdump" -d "$SO" | grep -q "curl_easy_setopt@plt"; then echo "setopt PLT present (ok)"; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhan1me_ech-${{ inputs.abi || 'arm64-v8a' }}
          path: c/ssl/build/libhan1me_ech.so
          if-no-files-found: error
