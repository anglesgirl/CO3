name: "Build Android APK (ECH)"

# Builds the ECH-enabled APK: compiles the Go ECH proxy into an Android AAR with
# gomobile, then builds the React Native app that loads it.
on:
  push:
    branches: [co3-b020]
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the ECH APK to'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ech-apk-build
  cancel-in-progress: true

env:
  NDK_VERSION: "27.1.12297006"

jobs:
  build-ech-apk:
    name: Build ECH Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Run tests
        run: >-
          npm test -- --config jest.features.config.js --runInBand
          __tests__/loginCookie.test.js
          __tests__/invitationQueue.test.js
          __tests__/requestedFeatures.test.js
          __tests__/historyNavigation.test.js
          __tests__/interfaceCleanup.test.js
          __tests__/echCoverage.test.js
          __tests__/userError.test.js
          __tests__/downloadExport.test.js
          __tests__/bookmarkAuth.test.js
          __tests__/thirdPartyImageProxy.test.js
          __tests__/debugLogging.test.js
          __tests__/bookmarkQuickActions.test.js
          __tests__/androidIdentity.test.js

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ubuntu-latest ships these tools, but does not add sdkmanager to PATH.
      # Use its installed cmdline-tools and avoid setup-android's expired
      # command-line-tools download URL (HTTP 404).
      - name: Configure preinstalled Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install pinned NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build ECH proxy AAR (gomobile, all ABIs)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd ech
          # Add x/mobile as a module dependency (required by gomobile bind).
          # NOTE: do not `go mod tidy` afterwards — it would strip this unused-by-source require.
          go get golang.org/x/mobile/bind@latest
          mkdir -p ../android/app/libs
          # 同时构建 32/64 位 ARM:x86 系列已无人在用,只保留 arm64 + armv7 照顾老设备。
          gomobile bind -v -target=android/arm,android/arm64 -androidapi 24 \
            -o ../android/app/libs/echproxy.aar ./echproxy
          ls -la ../android/app/libs

      - name: Generate codegen artifacts
        run: |
          cd android
          ./gradlew generateCodegenArtifactsFromSchema

      - name: Build Release APK (arm64-v8a + armeabi-v7a)
        run: |
          cd android
          ./gradlew assembleRelease -PBUILD_ABI=arm64-v8a,armeabi-v7a -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          BUILD_ABI: arm64-v8a,armeabi-v7a

      - name: Collect & rename split APKs
        id: artifact
        run: |
          APK_DIR=android/app/build/outputs/apk/release
          ls -la "$APK_DIR"
          test -f "$APK_DIR/app-arm64-v8a-release.apk"
          test -f "$APK_DIR/app-armeabi-v7a-release.apk"
          cp "$APK_DIR/app-arm64-v8a-release.apk"   "CO3-Android-ECH-arm64-v8a.apk"
          cp "$APK_DIR/app-armeabi-v7a-release.apk" "CO3-Android-ECH-armeabi-v7a.apk"
          echo "apk_glob=CO3-Android-ECH-*.apk" >> "$GITHUB_OUTPUT"
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "artifact_name=CO3-ECH-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          ls -la CO3-Android-ECH-*.apk

      - name: Verify ABIs in artifacts
        run: |
          for apk in CO3-Android-ECH-*.apk; do
            echo "=== $apk ==="
            unzip -l "$apk" > apk-files.txt
            if echo "$apk" | grep -q 'arm64-v8a'; then
              grep -q 'lib/arm64-v8a/' apk-files.txt || { echo "Missing lib/arm64-v8a/"; exit 1; }
            fi
            if echo "$apk" | grep -q 'armeabi-v7a'; then
              grep -q 'lib/armeabi-v7a/' apk-files.txt || { echo "Missing lib/armeabi-v7a/"; exit 1; }
            fi
            # 不应出现 x86 系列
            if grep -Eq 'lib/(x86|x86_64)/' apk-files.txt; then
              echo "Unexpected x86 native libraries found"
              exit 1
            fi
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.apk_glob }}
          retention-days: 30

      - name: Attach ECH APKs to GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: ${{ steps.artifact.outputs.apk_glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
