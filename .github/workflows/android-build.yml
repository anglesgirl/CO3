name: "Build Android APK"

on:
  push:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the APK to'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Clone llama.cpp (Q2_0c PR branch for HyMT 2bit)
        run: |
          # 注意：目录名不能以 .cpp 结尾！ReactNative-application.cmake 的
          # file(GLOB *.cpp) 会把 llama.cpp 目录误当源文件编译（Is a directory）。
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git android/app/src/main/jni/llama-src
          cd android/app/src/main/jni/llama-src
          git fetch origin pull/19357/head:pr-q2 && git checkout pr-q2
          git log --oneline -n 1

      - name: Generate codegen artifacts
        run: |
          cd android
          ./gradlew generateCodegenArtifactsFromSchema

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Rename artifacts  # highlight
        run: |  # highlight
          APK_DIR=android/app/build/outputs/apk/release  # highlight
          mv $APK_DIR/app-arm64-v8a-release.apk   CO3-Android-arm64-v8a.apk  # highlight
          mv $APK_DIR/app-armeabi-v7a-release.apk CO3-Android-armeabi-v7a.apk  # highlight
          mv $APK_DIR/app-x86-release.apk          CO3-Android-x86.apk  # highlight
          mv $APK_DIR/app-x86_64-release.apk       CO3-Android-x86_64.apk  # highlight

      - name: Upload APK artifacts  # highlight
        uses: actions/upload-artifact@v4
        with:
          name: CO3-${{ github.sha }}
          path: CO3-Android-*.apk  # highlight
          retention-days: 30

      - name: Attach APKs to GitHub Release  # highlight
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: CO3-Android-*.apk  # highlight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash .github/scripts/notify-build-result.sh