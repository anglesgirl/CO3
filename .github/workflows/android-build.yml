name: "Build Android APK"
on:
  push:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the APK to'
        required: true
        type: string
permissions:
  contents: write
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install NPM dependencies
        run: npm ci
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Set ANDROID_HOME
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
      - name: Install Android NDK and CMake
        run: |
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
      - name: Fetch official HyMT prebuilt libs (from official Demo APK)
        run: |
          curl -sL --retry 3 --max-time 300 -A "Mozilla/5.0" -o /tmp/hymt-demo.apk \
            "https://modelscope.cn/models/AngelSlim/Hy-MT1.5-1.8B-1.25bit-GGUF/resolve/master/Hy-MT-demo.apk"
          ls -la /tmp/hymt-demo.apk
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cd /tmp && unzip -o -j hymt-demo.apk \
            "lib/arm64-v8a/libai-chat.so" \
            "lib/arm64-v8a/libllama.so" \
            "lib/arm64-v8a/libggml.so" \
            "lib/arm64-v8a/libggml-base.so" \
            "lib/arm64-v8a/libggml-cpu-android_*.so" \
            "lib/arm64-v8a/libomp.so" \
            -d "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          ls -la "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'   # >=1.26.5: CVE-2026-42505 (ECH 隐私泄漏)

      - name: Build ECH proxy Android AAR (gomobile)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd ech
          # gomobile bind 需要 x/mobile 作为模块依赖。
          # 注意：之后**不要**跑 `go mod tidy` —— 它会把这个"源码未直接引用"的
          # require 清掉，导致下次 bind 失败。
          go get golang.org/x/mobile/bind@latest
          mkdir -p ../android/app/libs
          # -target=android 产出多 ABI 的 aar（gomobile 默认含 arm64/armv7/x86/x86_64）
          gomobile bind -v -target=android -androidapi 24 \
            -o ../android/app/libs/echproxy.aar ./echproxy
          ls -la ../android/app/libs/
          echo "=== 防回归：Go 导出符号必须在 classes.jar 里 ==="
          cd ../android/app/libs
          unzip -p echproxy.aar classes.jar > /tmp/echproxy-classes.jar
          javap -classpath /tmp/echproxy-classes.jar echproxy.Echproxy \
            | grep -E "void start|void stop|String jarInfo|String drainLogs|String lastStatus|String fetchTxt|void clearSessionCookies" \
            || { echo "::error::Go 导出符号缺失（EchProxyCore 将编译失败）"; exit 1; }
          echo "✅ Echproxy 导出符号齐全（同进程 Go 代理通路可用）"

      - name: Generate codegen artifacts
        run: |
          cd android
          ./gradlew generateCodegenArtifactsFromSchema
      - name: JS 具名 import 门禁（防止 undefined is not a function 崩启动）
        run: python3 tools/check_js_imports.py
      - name: Build Release APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon
      - name: Rename artifacts
        if: always()
        run: |
          mkdir -p /tmp/apk
          cp android/app/build/outputs/apk/release/*.apk /tmp/apk/ 2>/dev/null || true
          ls -la /tmp/apk/
      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co3-release-apk
          path: /tmp/apk
      # 【自动发布到 Release 页】每次构建成功都把 APK 推到一个 pre-release
      #（tag = ech-<commit sha>，唯一不冲突）。用户直接从 Release 页下载，
      # 比 GitHub Actions artifact 在国内快得多（2026-09-27 用户实测反馈）。
      - name: Publish APKs to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ech-${{ github.sha }}
          name: "ECH Build ${{ github.sha }}"
          body: |
            CO3 ECH 自动构建（pre-release）

            Commit: `${{ github.sha }}`
            包含：Conscrypt ECH 网络栈 + LocalEchProxy + 一键日志导出
            + 登录闭环修复（proxy_notice=0 / Set-Cookie 双写）

            按 ABI 下载对应 APK（arm64-v8a 用于绝大多数现代手机）。
          files: /tmp/apk/*.apk
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Notify build result
        if: always()
        run: echo "Build completed (check artifacts)"
