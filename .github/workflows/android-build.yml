name: "Build Android APK"
on:
  push:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the APK to'
        required: true
        type: string
permissions:
  contents: write
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install NPM dependencies
        run: npm ci
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Set ANDROID_HOME
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
      # HyMT（本机 AI 翻译）的官方预编译 so —— 与 ECH 无关，保留。
      - name: Fetch official HyMT prebuilt libs (from official Demo APK)
        run: |
          curl -sL --retry 3 --max-time 300 -A "Mozilla/5.0" -o /tmp/hymt-demo.apk \
            "https://modelscope.cn/models/AngelSlim/Hy-MT1.5-1.8B-1.25bit-GGUF/resolve/master/Hy-MT-demo.apk"
          ls -la /tmp/hymt-demo.apk
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cd /tmp && unzip -o -j hymt-demo.apk \
            "lib/arm64-v8a/libai-chat.so" \
            "lib/arm64-v8a/libllama.so" \
            "lib/arm64-v8a/libggml.so" \
            "lib/arm64-v8a/libggml-base.so" \
            "lib/arm64-v8a/libggml-cpu-android_*.so" \
            "lib/arm64-v8a/libomp.so" \
            -d "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          ls -la "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
            gradle-

      - name: Generate codegen artifacts
        run: |
          cd android
          ./gradlew generateCodegenArtifactsFromSchema
      - name: JS 具名 import 门禁（防止 undefined is not a function 崩启动）
        run: python3 tools/check_js_imports.py
      - name: Build Release APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon
      - name: Rename artifacts
        if: always()
        run: |
          mkdir -p /tmp/apk
          cp android/app/build/outputs/apk/release/*.apk /tmp/apk/ 2>/dev/null || true
          ls -la /tmp/apk/
      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co3-release-apk
          path: /tmp/apk
      # 【自动发布到 Release 页】每次构建成功都把 APK 推到一个 pre-release
      #（tag = ech-<commit sha>，唯一不冲突）。用户直接从 Release 页下载，
      # 比 GitHub Actions artifact 在国内快得多（2026-09-27 用户实测反馈）。
      - name: Publish APKs to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ech-${{ github.sha }}
          name: "ECH Build ${{ github.sha }}"
          body: |
            CO3 ECH 自动构建（pre-release）

            Commit: `${{ github.sha }}`
            包含：进程内 ech_http 引擎（libco3ech.so）+ 一键日志导出
            + 登录闭环修复（proxy_notice=0 / Set-Cookie 双写）

            按 ABI 下载对应 APK（arm64-v8a 用于绝大多数现代手机）。
          files: /tmp/apk/*.apk
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Notify build result
        if: always()
        run: echo "Build completed (check artifacts)"
