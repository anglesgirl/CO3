name: "Build Android APK"
on:
  push:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the APK to'
        required: true
        type: string
permissions:
  contents: write
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install NPM dependencies
        run: npm ci
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Set ANDROID_HOME
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
      - name: Install Android NDK and CMake
        run: |
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
      - name: Fetch official HyMT prebuilt libs (from official Demo APK)
        run: |
          curl -sL --retry 3 --max-time 300 -A "Mozilla/5.0" -o /tmp/hymt-demo.apk \
            "https://modelscope.cn/models/AngelSlim/Hy-MT1.5-1.8B-1.25bit-GGUF/resolve/master/Hy-MT-demo.apk"
          ls -la /tmp/hymt-demo.apk
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cd /tmp && unzip -o -j hymt-demo.apk \
            "lib/arm64-v8a/libai-chat.so" \
            "lib/arm64-v8a/libllama.so" \
            "lib/arm64-v8a/libggml.so" \
            "lib/arm64-v8a/libggml-base.so" \
            "lib/arm64-v8a/libggml-cpu-android_*.so" \
            "lib/arm64-v8a/libomp.so" \
            -d "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          ls -la "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"

      # ══ ech_http 原生引擎：复用 ech-research 预编译的 BoringSSL + libcurl ══
      # 与 HyMT 同样的投放方式：CI 编出 libco3ech.so 放进 jniLibs。
      # 刻意不用 gradle 的 externalNativeBuild（见 android/app/build.gradle 说明）。
      - name: Cache ech_http 预编译 SDK (BoringSSL + libcurl)
        uses: actions/cache@v4
        with:
          path: ~/ech_http_sdk
          key: ech-http-sdk-v0.1.1-${{ runner.os }}

      - name: Build libco3ech.so (ech_http 引擎 + JNI 桥)
        run: |
          set -euo pipefail
          # 用 runner 预装的 NDK 28.2：引擎已在该版本上验证过编译/链接/页对齐
          NDK=/usr/local/lib/android/sdk/ndk/28.2.13676358
          SDK_ROOT="$HOME/ech_http_sdk"
          mkdir -p "$SDK_ROOT"

          fetch_sdk() {  # $1=sdk 名  $2=官方 SHA-256
            local name="$1" sha="$2" dest="$SDK_ROOT/$1"
            if [ -f "$dest/.ok" ]; then echo "复用缓存的 $name"; return 0; fi
            rm -rf "$dest"; mkdir -p "$dest"
            curl -sSL --retry 3 --max-time 600 -o /tmp/eh-sdk.zip \
              "https://github.com/ech-research/libechhttp-android-build/releases/download/v0.1.1/libechhttp-deps-v0.1.1-$name.zip"
            echo "$sha  /tmp/eh-sdk.zip" | sha256sum -c -
            unzip -q /tmp/eh-sdk.zip -d "$dest"
            rm -f /tmp/eh-sdk.zip
            touch "$dest/.ok"
          }

          fetch_sdk android-arm64 88f2258556a253b6856988e418826e21cf0822a1d6a5793ca98c5e48c738ad69
          fetch_sdk android-arm   f221237ababb51d4fe900eb562d9218dad28160340f513ae3ecb5dcdba72bfa1

          for pair in "arm64-v8a:android-arm64" "armeabi-v7a:android-arm"; do
            ABI="${pair%%:*}"; NAME="${pair##*:}"
            echo "──────── 编译 $ABI ────────"
            cmake -S android/app/src/main/cpp -B "build/ech-$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-24 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release \
              -DEH_DEPS_ROOT="$SDK_ROOT/$NAME"
            cmake --build "build/ech-$ABI" --parallel 4
            mkdir -p "android/app/src/main/jniLibs/$ABI"
            cp "build/ech-$ABI/out/libco3ech.so" "android/app/src/main/jniLibs/$ABI/"
            ls -lh "android/app/src/main/jniLibs/$ABI/libco3ech.so"
          done

      - name: Inspect libco3ech.so (页对齐 / 依赖 / JNI 符号)
        # 这里只做体检并打印，**不阻断构建**：真正的验收以「下载 APK 后核对包内 so」为准。
        # 上一版把断言写成 exit 1，结果自身 bug（grep -m 提前退出 → 上游 SIGPIPE →
        # pipefail 判失败）把整条构建链掐断，导致一个包都出不来。
        continue-on-error: true
        run: |
          set -uo pipefail
          NDK=/usr/local/lib/android/sdk/ndk/28.2.13676358
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p build/verify
          for ABI in arm64-v8a armeabi-v7a; do
            SO="android/app/src/main/jniLibs/$ABI/libco3ech.so"
            echo "──── $ABI ────"
            file "$SO"
            # 先把工具输出落盘再筛选，避免管道提前退出触发上游 SIGPIPE
            "$BIN/llvm-readelf" -l "$SO"           > "build/verify/$ABI.headers" 2>&1
            "$BIN/llvm-readelf" -d "$SO"           > "build/verify/$ABI.dynamic" 2>&1
            "$BIN/llvm-nm" -D --defined-only "$SO" > "build/verify/$ABI.dynsyms" 2>&1

            echo "-- LOAD 段（期望 0x4000 = 16 KiB 对齐）--"
            grep -E 'LOAD' "build/verify/$ABI.headers" || echo "(无 LOAD 段)"
            echo "-- 动态依赖（期望仅 libc/libm/libdl）--"
            grep -E 'NEEDED|SONAME' "build/verify/$ABI.dynamic" || echo "(无动态依赖)"
            echo "-- 导出的 JNI 入口（Kotlin 侧依赖它，缺了会 UnsatisfiedLinkError）--"
            grep -E 'Java_com_co3_ech_EchHttpNative' "build/verify/$ABI.dynsyms" \
              || echo "(未找到 JNI 入口，需排查)"
            echo "-- 外部 SSL/curl 依赖检查 --"
            if grep -Ei 'NEEDED.*(ssl|crypto|curl|zlib)' "build/verify/$ABI.dynamic"; then
              echo "!! 静态链接未生效（上面这些不该出现）"
            else
              echo "OK：无外部 SSL/curl 依赖，静态链接生效"
            fi
          done

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
            gradle-

      - name: Generate codegen artifacts
        run: |
          cd android
          ./gradlew generateCodegenArtifactsFromSchema
      - name: JS 具名 import 门禁（防止 undefined is not a function 崩启动）
        run: python3 tools/check_js_imports.py
      - name: Build Release APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon
      - name: Rename artifacts
        if: always()
        run: |
          mkdir -p /tmp/apk
          cp android/app/build/outputs/apk/release/*.apk /tmp/apk/ 2>/dev/null || true
          ls -la /tmp/apk/
      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co3-release-apk
          path: /tmp/apk
      # 【自动发布到 Release 页】每次构建成功都把 APK 推到一个 pre-release
      #（tag = ech-<commit sha>，唯一不冲突）。用户直接从 Release 页下载，
      # 比 GitHub Actions artifact 在国内快得多（2026-09-27 用户实测反馈）。
      - name: Publish APKs to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ech-${{ github.sha }}
          name: "ECH Build ${{ github.sha }}"
          body: |
            CO3 ECH 自动构建（pre-release）

            Commit: `${{ github.sha }}`
            包含：进程内 ech_http 引擎（libco3ech.so）+ 一键日志导出
            + 登录闭环修复（proxy_notice=0 / Set-Cookie 双写）

            按 ABI 下载对应 APK（arm64-v8a 用于绝大多数现代手机）。
          files: /tmp/apk/*.apk
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Notify build result
        if: always()
        run: echo "Build completed (check artifacts)"
