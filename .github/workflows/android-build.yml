name: "Build Android APK"

on:
  # The ECH branch has its own workflow, which builds the required gomobile
  # dependency first. Do not also run this non-ECH workflow there.
  push:
    branches-ignore: [ech-support, co3-b020]
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the APK to'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate codegen artifacts
        run: |
          cd android
          ./gradlew generateCodegenArtifactsFromSchema

      - name: Build Release APK
        run: |
          cd android
          # 只构建 32/64 位 ARM:x86 系列已无人在用,只保留 arm64 + armv7 照顾老设备。
          BUILD_ABI=arm64-v8a,armeabi-v7a ./gradlew assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          BUILD_ABI: arm64-v8a,armeabi-v7a

      - name: Rename artifacts
        run: |
          APK_DIR=android/app/build/outputs/apk/release
          mv $APK_DIR/app-arm64-v8a-release.apk   CO3-Android-arm64-v8a.apk
          mv $APK_DIR/app-armeabi-v7a-release.apk CO3-Android-armeabi-v7a.apk
          ls -la CO3-Android-*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CO3-${{ github.sha }}
          path: CO3-Android-*.apk
          retention-days: 30

      - name: Attach APKs to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: CO3-Android-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}