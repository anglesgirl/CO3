name: "Build Android APK"

on:
  push:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the APK to'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Fetch official HyMT prebuilt libs (from official Demo APK)
        run: |
          # 官方 Demo 的 libai-chat.so + libllama.so + libggml*.so 是配套的成品：
          # libai-chat.so 是 ARM 的 JNI 封装（Java_com_arm_aichat_internal_*），
          # 其 ggml 类型编号与官方 GGUF 严格配套（2bit=Q2_0C / 1.25bit=STQ_0）。
          # 自编 llama.cpp 会因编号错位加载失败，故直接复用官方成品。
          curl -sL --retry 3 --max-time 300 -A "Mozilla/5.0" -o /tmp/hymt-demo.apk \
            "https://modelscope.cn/models/AngelSlim/Hy-MT1.5-1.8B-1.25bit-GGUF/resolve/master/Hy-MT-demo.apk"
          ls -la /tmp/hymt-demo.apk
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cd /tmp && unzip -o -j hymt-demo.apk \
            "lib/arm64-v8a/libai-chat.so" \
            "lib/arm64-v8a/libllama.so" \
            "lib/arm64-v8a/libggml.so" \
            "lib/arm64-v8a/libggml-base.so" \
            "lib/arm64-v8a/libggml-cpu-android_*.so" \
            "lib/arm64-v8a/libomp.so" \
            -d "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          ls -la "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"

      - name: Generate codegen artifacts
        run: |
          cd android
          ./gradlew generateCodegenArtifactsFromSchema

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Rename artifacts  # highlight
        run: |  # highlight
          APK_DIR=android/app/build/outputs/apk/release  # highlight
          mv $APK_DIR/app-arm64-v8a-release.apk   CO3-Android-arm64-v8a.apk  # highlight
          mv $APK_DIR/app-armeabi-v7a-release.apk CO3-Android-armeabi-v7a.apk  # highlight
          mv $APK_DIR/app-x86-release.apk          CO3-Android-x86.apk  # highlight
          mv $APK_DIR/app-x86_64-release.apk       CO3-Android-x86_64.apk  # highlight

      - name: Upload APK artifacts  # highlight
        uses: actions/upload-artifact@v4
        with:
          name: CO3-${{ github.sha }}
          path: CO3-Android-*.apk  # highlight
          retention-days: 30

      - name: Attach APKs to GitHub Release  # highlight
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: CO3-Android-*.apk  # highlight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash .github/scripts/notify-build-result.sh