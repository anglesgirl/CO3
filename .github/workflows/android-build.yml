name: "Build Android APK"

on:
  # The ECH branch has its own workflow, which builds the required gomobile
  # dependency first. Do not also run this non-ECH workflow there.
  push:
    branches-ignore: [ech-support, co3-b020]
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the APK to'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate codegen artifacts
        run: |
          cd android
          ./gradlew generateCodegenArtifactsFromSchema

      - name: Build Release APK
        run: |
          cd android
          # Default to arm64-v8a only — this produces a ~40-55M APK that runs on 99% of real
          # modern Android devices (and is half the size of the universal 4-ABI build).
          # To build universal / split APKs use BUILD_ABI=x86,x86_64,armeabi-v7a,arm64-v8a
          BUILD_ABI=arm64-v8a ./gradlew assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          BUILD_ABI: arm64-v8a

      - name: Rename artifacts  # highlight
        run: |  # highlight
          APK_DIR=android/app/build/outputs/apk/release  # highlight
          mv $APK_DIR/app-arm64-v8a-release.apk   CO3-Android-arm64-v8a.apk  # highlight
          mv $APK_DIR/app-armeabi-v7a-release.apk CO3-Android-armeabi-v7a.apk  # highlight
          mv $APK_DIR/app-x86-release.apk          CO3-Android-x86.apk  # highlight
          mv $APK_DIR/app-x86_64-release.apk       CO3-Android-x86_64.apk  # highlight

      - name: Upload APK artifacts  # highlight
        uses: actions/upload-artifact@v4
        with:
          name: CO3-${{ github.sha }}
          path: CO3-Android-*.apk  # highlight
          retention-days: 30

      - name: Attach APKs to GitHub Release  # highlight
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: CO3-Android-*.apk  # highlight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}