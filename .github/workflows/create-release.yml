name: Manual Release with Custom Tag
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag name (e.g., B1.2.3 or V1.0.0)'
        required: true
        type: string

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format (optional)
        run: |
          if [[ ! "${{ github.event.inputs.version_tag }}" =~ ^[BV][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "⚠️ Tag should start with B or V followed by semver (e.g., B1.2.3, V2.0.0)"
            echo "Continuing anyway..."
          fi

      - name: Compute versionCode (from tag last number)
        id: version
        run: |
          # 从 tag (B0.0.23) 取最后一位作为 versionCode,保证与 versionName 一致。
          # 这样同一 tag 重跑不会导致 versionCode 递增、测试失败。
          TAG="${{ github.event.inputs.version_tag }}"
          if [[ "$TAG" =~ ^[BV][0-9]+\.[0-9]+\.([0-9]+)$ ]]; then
            VERSION_CODE=${BASH_REMATCH[1]}
          else
            # 回退:从 build.gradle 读当前 versionCode 再 +1
            CURRENT_VC=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle | head -1)
            VERSION_CODE=$((CURRENT_VC + 1))
          fi
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📦 Tag: $TAG | versionCode: $VERSION_CODE"

      - name: Update JS version constant
        run: |
          sed -i "s/export const co3Version = \"[^\"]*\"/export const co3Version = \"${{ steps.version.outputs.tag }}\"/" main/constant.js
          echo "✅ Updated JS version constant to ${{ steps.version.outputs.tag }}"

      - name: Update build.gradle
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${{ steps.version.outputs.versionCode }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.tag }}\"/" android/app/build.gradle
          echo "✅ Updated:"
          grep "versionCode\|versionName" android/app/build.gradle

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle
          git add main/constant.js
          if ! git diff --cached --quiet; then
            git commit -m "Release ${{ steps.version.outputs.tag }}"
          else
            echo "No changes to commit (files already updated)"
          fi
          git tag ${{ steps.version.outputs.tag }} 2>/dev/null || echo "Tag already exists locally"
          git push origin main
          # co3-b020 可能与当前 checkout 分支不同名,用 refspec 直接推,
          # 不依赖本地是否 checkout 了该分支。
          git push origin main:co3-b020
          git push origin ${{ steps.version.outputs.tag }} 2>/dev/null || echo "Tag already exists on remote"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger iOS build
        run: |
          curl -X POST \
            -H "Authorization: token ${ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/ios-build.yml/dispatches \
            -d '{
              "ref": "main",
              "inputs": {
                "release_tag": "${{ steps.version.outputs.tag }}"
              }
            }'

      - name: Trigger Android ECH build
        run: |
          curl -X POST \
            -H "Authorization: token ${ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/android-ech.yml/dispatches \
            -d '{
              "ref": "co3-b020",
              "inputs": {
                "release_tag": "${{ steps.version.outputs.tag }}"
              }
            }'