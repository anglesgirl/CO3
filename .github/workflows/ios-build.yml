name: "Build iOS IPA (Unsigned)"

on:
  push:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the IPA to'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}  # checkout the tag

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Generate codegen artifacts
        run: npx react-native codegen --platform ios --outputPath .

      # ⚠️ 必须排在 `pod install` **之前**：Podfile 里引用了本地 pod
      # EchProxyBridge，而它依赖这里生成的 Echproxy.xcframework。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build ECH proxy iOS framework (gomobile)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd ech
          # gomobile bind 需要 x/mobile 作为模块依赖。
          # 注意：之后**不要**跑 `go mod tidy` —— 它会把这个"源码未直接引用"的
          # require 清掉，导致下次 bind 失败。
          go get golang.org/x/mobile/bind@latest
          mkdir -p ../ios/EchProxyBridge
          # -target=ios 产出 universal xcframework（模拟器 + 真机）
          gomobile bind -v -target=ios \
            -o ../ios/EchProxyBridge/Echproxy.xcframework ./echproxy
          ls -la ../ios/EchProxyBridge/
          echo "=== module.modulemap（Swift 里 `import Echproxy` 依赖它）==="
          find ../ios/EchProxyBridge -name "module.modulemap" -exec sh -c 'echo "--- {}"; cat {}' \;

      - name: Verify native module registration is present
        run: |
          # 防回归：Swift 模块必须有 ObjC 注册宏，否则运行时
          # NativeModules.EchProxy === undefined → ECH 静默不启动 → 全部请求 fail-closed。
          # （历史上正是因为缺这个宏，iOS 上 ECH 从未启动过。）
          test -f ios/EchProxyBridge/EchProxyBridge.m \
            || { echo "::error::ios/EchProxyBridge/EchProxyBridge.m missing — EchProxy 原生模块不会注册"; exit 1; }

      # ⚠️ 同样必须排在 `pod install` 之前：Podfile 引用了本地 pod HymtBridge，
      # 而它依赖这里生成的 llama.xcframework。
      - name: Cache llama.xcframework
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: ios/HymtBridge/llama.xcframework
          # 版本号绑定到固定 commit：换了 commit 就得重编，避免用到旧的二进制
          key: llama-xcframework-${{ runner.os }}-2a3005c-ios-device-v1

      - name: Build llama.cpp iOS framework
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          # 固定到已在本机验证过的 commit（Q4_K_M 能正常加载并翻译）
          LLAMA_COMMIT=2a3005c
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cd /tmp/llama.cpp
          git fetch --depth 1 origin "$LLAMA_COMMIT"
          git checkout "$LLAMA_COMMIT"
          # 只编 iOS 真机切片 —— 跳过模拟器/macOS/tvOS/visionOS，CI 时间省一大半。
          # （侧载测试只需真机；要是以后要跑模拟器，把 ios-sim 加回来并把 podspec 的
          #   HEADER_SEARCH_PATHS 一起补上。）
          ./build-xcframework.sh ios-device
          mkdir -p "$GITHUB_WORKSPACE/ios/HymtBridge"
          rm -rf "$GITHUB_WORKSPACE/ios/HymtBridge/llama.xcframework"
          cp -R build-apple/llama.xcframework "$GITHUB_WORKSPACE/ios/HymtBridge/"

      - name: Verify on-device translation bridge is present
        run: |
          # 防回归（与 ECH 那次同样的坑）：少了注册宏 .m，App 照样能编译能链接，
          # 但运行时 NativeModules.Hymt === undefined → iOS 上"本机 AI"永远不可用。
          test -f ios/HymtBridge/HymtBridge.m \
            || { echo "::error::ios/HymtBridge/HymtBridge.m missing — Hymt 原生模块不会注册"; exit 1; }
          test -d ios/HymtBridge/llama.xcframework \
            || { echo "::error::llama.xcframework missing — pod install 会失败"; exit 1; }
          # 确认 xcframework 里确实有 iOS 真机切片
          test -d ios/HymtBridge/llama.xcframework/ios-arm64 \
            || { echo "::error::llama.xcframework 缺少 ios-arm64 切片"; exit 1; }
          grep -q "RCT_EXTERN_REMAP_MODULE(Hymt" ios/HymtBridge/HymtBridge.m \
            || { echo "::error::HymtBridge.m 里没有 Hymt 模块注册宏"; exit 1; }
          echo "✅ HymtBridge 注册宏与 llama.xcframework 就位"

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: bundle exec pod install
        env:
          RCT_NEW_ARCH_ENABLED: 1
        working-directory: ./ios

      - name: Archive app (unsigned release)
        run: |
          xcodebuild archive \
            -workspace CO3.xcworkspace \
            -scheme CO3 \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/CO3.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
        working-directory: ./ios

      - name: Package .app into IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/CO3.xcarchive/Products/Applications" -name "*.app" | head -n 1)
          echo "Packaging: $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$GITHUB_WORKSPACE/CO3.ipa" Payload/

      - name: Rename artefact
        run: mv CO3.ipa CO3-IOS.ipa

      - name: Upload IPA artifact (for workflow summary)
        uses: actions/upload-artifact@v4
        with:
          name: CO3-${{ github.sha }}
          path: CO3-IOS.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: CO3-IOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}