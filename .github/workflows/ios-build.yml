name: "Build iOS IPA (Unsigned)"

# Disabled auto-trigger on push — the iOS port is still a WIP and every test push
# would spend ~20 min of macOS runner time for no artifact. Run manually via
# workflow_dispatch when actually needed.
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the IPA to (leave empty to build main branch without attaching)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}  # checkout the tag

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Generate codegen artifacts
        run: npx react-native codegen --platform ios --outputPath .

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build ECH proxy iOS framework (gomobile)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd ech
          # Add x/mobile as a module dependency (required by gomobile bind).
          # NOTE: do not `go mod tidy` afterwards — it would strip this unused-by-source require.
          go get golang.org/x/mobile/bind@latest
          mkdir -p ../ios/EchProxyBridge
          # -target=ios builds a universal xcframework (simulator + device).
          gomobile bind -v -target=ios \
            -o ../ios/EchProxyBridge/Echproxy.xcframework ./echproxy
          ls -la ../ios/EchProxyBridge/
          echo "=== Echproxy.h (generated API) ==="
          cat ../ios/EchProxyBridge/Echproxy.xcframework/ios-arm64/*/Headers/Echproxy.h \
            || cat ../ios/EchProxyBridge/Echproxy.xcframework/*/Headers/Echproxy.h 2>/dev/null \
            || find ../ios/EchProxyBridge -name "*.h" -exec cat {} \;
          echo "=== module.modulemap (Swift import Echproxy 依赖它) ==="
          find ../ios/EchProxyBridge -name "module.modulemap" -exec sh -c 'echo "--- {}"; cat {}' \;

      - name: Verify native module registration is present
        run: |
          # 防回归：Swift 模块必须有 ObjC 注册宏，否则运行时
          # NativeModules.EchProxy === undefined，ECH 静默不启动。
          test -f ios/EchProxyBridge/EchProxyBridge.m \
            || { echo "::error::ios/EchProxyBridge/EchProxyBridge.m missing — EchProxy native module will NOT register"; exit 1; }
          grep -q "RCT_EXTERN_REMAP_MODULE(EchProxy, EchProxyModule" ios/EchProxyBridge/EchProxyBridge.m \
            || { echo "::error::RCT_EXTERN_REMAP_MODULE(EchProxy, EchProxyModule, ...) not found"; exit 1; }
          grep -q "^import Echproxy" ios/EchProxyBridge/EchProxyModule.swift \
            || { echo "::error::EchProxyModule.swift missing 'import Echproxy'"; exit 1; }

      - name: Verify diagnostic logging is wired
        # 出问题时要能从我们自己的日志服务看到现场，所以这几处必须在：
        # 原生上报器、JS 上报器、echKy 里的接线点。
        run: |
          set -e
          test -f ios/EchProxyBridge/EchLogger.swift \
            || { echo "::error::ios/EchProxyBridge/EchLogger.swift missing"; exit 1; }
          grep -q "log.anglesgirl.eu.org" ios/EchProxyBridge/EchLogger.swift \
            || { echo "::error::EchLogger 上报地址不对"; exit 1; }
          test -f main/utils/remoteLog.js \
            || { echo "::error::main/utils/remoteLog.js missing"; exit 1; }
          grep -q "remoteLog" main/web/echKy.js \
            || { echo "::error::echKy.js 没有接远程日志"; exit 1; }
          grep -q "proxy_native_status" main/web/echKy.js \
            || { echo "::error::echKy.js 没有上报原生 ECH 状态（ECHAccepted）"; exit 1; }
          echo "诊断日志接线检查通过 ✓"
          echo "✅ EchProxy bridge registration + framework import verified"

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: bundle exec pod install
        env:
          RCT_NEW_ARCH_ENABLED: 1
        working-directory: ./ios

      - name: Archive app (unsigned release)
        run: |
          xcodebuild archive \
            -workspace CO3.xcworkspace \
            -scheme CO3 \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/CO3.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
        working-directory: ./ios

      - name: Package .app into IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/CO3.xcarchive/Products/Applications" -name "*.app" | head -n 1)
          echo "Packaging: $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$GITHUB_WORKSPACE/CO3.ipa" Payload/

      - name: Rename artefact
        run: mv CO3.ipa CO3-IOS.ipa

      - name: Upload IPA artifact (for workflow summary)
        uses: actions/upload-artifact@v4
        with:
          name: CO3-${{ github.sha }}
          path: CO3-IOS.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: CO3-IOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify build result (Telegram)
        # 成败都回传，成功的直接把 IPA 发到对话里（用户装包即用，不用去 Release 找）
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_STATUS: ${{ job.status }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "缺少 Telegram secret，跳过通知"; exit 0
          fi
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHORT="${GITHUB_SHA:0:7}"
          send() {
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=Markdown \
              --data-urlencode "text=$1" | head -c 400; echo
          }
          if [ "$BUILD_STATUS" = "success" ] && [ -f CO3-IOS.ipa ]; then
            SIZE_MB=$(du -m CO3-IOS.ipa | cut -f1)
            send "✅ CO3 iOS 构建成功 \`${SHORT}\` (${SIZE_MB}MB，含 ECH 诊断日志)
          [查看运行](${RUN_URL})"
            if [ "$SIZE_MB" -lt 50 ]; then
              curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F caption="CO3 iOS ${SHORT}（未签名 IPA，含 ECH 诊断日志）" \
                -F document=@"CO3-IOS.ipa" | head -c 400; echo
            else
              send "⚠️ IPA ${SIZE_MB}MB 超过机器人 50M 上限，请到 Artifact 下载"
            fi
          else
            send "❌ CO3 iOS 构建失败 \`${SHORT}\` | \`${BUILD_STATUS}\`
          [查看运行](${RUN_URL})"
          fi