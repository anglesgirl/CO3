name: "Build iOS IPA (Unsigned)"

on:
  push:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to attach the IPA to'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}  # checkout the tag

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Generate codegen artifacts
        run: npx react-native codegen --platform ios --outputPath .

      # ⚠️ 必须排在 `pod install` **之前**：Podfile 里引用了本地 pod
      # EchProxyBridge，而它依赖这里生成的 Echproxy.xcframework。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build ECH proxy iOS framework (gomobile)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd ech
          # gomobile bind 需要 x/mobile 作为模块依赖。
          # 注意：之后**不要**跑 `go mod tidy` —— 它会把这个"源码未直接引用"的
          # require 清掉，导致下次 bind 失败。
          go get golang.org/x/mobile/bind@latest
          mkdir -p ../ios/EchProxyBridge
          # -target=ios 产出 universal xcframework（模拟器 + 真机）
          gomobile bind -v -target=ios \
            -o ../ios/EchProxyBridge/Echproxy.xcframework ./echproxy
          ls -la ../ios/EchProxyBridge/
          echo "=== module.modulemap（Swift 里 `import Echproxy` 依赖它）==="
          find ../ios/EchProxyBridge -name "module.modulemap" -exec sh -c 'echo "--- {}"; cat {}' \;

      - name: Verify native module registration is present
        run: |
          # 防回归：Swift 模块必须有 ObjC 注册宏，否则运行时
          # NativeModules.EchProxy === undefined → ECH 静默不启动 → 全部请求 fail-closed。
          # （历史上正是因为缺这个宏，iOS 上 ECH 从未启动过。）
          test -f ios/EchProxyBridge/EchProxyBridge.m \
            || { echo "::error::ios/EchProxyBridge/EchProxyBridge.m missing — EchProxy 原生模块不会注册"; exit 1; }

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: bundle exec pod install
        env:
          RCT_NEW_ARCH_ENABLED: 1
        working-directory: ./ios

      - name: Archive app (unsigned release)
        run: |
          xcodebuild archive \
            -workspace CO3.xcworkspace \
            -scheme CO3 \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/CO3.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
        working-directory: ./ios

      - name: Package .app into IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/CO3.xcarchive/Products/Applications" -name "*.app" | head -n 1)
          echo "Packaging: $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$GITHUB_WORKSPACE/CO3.ipa" Payload/

      - name: Rename artefact
        run: mv CO3.ipa CO3-IOS.ipa

      - name: Upload IPA artifact (for workflow summary)
        uses: actions/upload-artifact@v4
        with:
          name: CO3-${{ github.sha }}
          path: CO3-IOS.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: CO3-IOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}