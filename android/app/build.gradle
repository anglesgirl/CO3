apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def requestedAbi  = (project.findProperty("BUILD_ABI") ?: System.getenv("BUILD_ABI"))?.trim()
def allAbis       = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
def universalOnly = requestedAbi == "universal"
def enableSplits  = !universalOnly
def abisToBuild   = (!universalOnly && requestedAbi)
    ? requestedAbi.split(",").collect { it.trim() }
    : allAbis

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.co3"

    // 关键：ggml 的 CPU 后端(libggml-cpu-android_*.so)是靠"扫描文件系统目录"加载的，
    // 官方 demo 能跑就是因为 extractNativeLibs=true（so 解压到 nativeLibraryDir）。
    // 默认 false 时 so 只存在于 APK 内，扫描不到 -> "no backends are loaded"
    // -> libai-chat load() 返回 1 (UnsupportedArchitecture)，模型 1ms 加载失败。
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    // 说明：本 app 不再声明 externalNativeBuild。
    // 端侧 AI 的 native 库直接用官方 Hy-MT Demo 的预编译 so（CI 提取到 jniLibs），
    // 由 Kotlin 侧 com.arm.aichat.internal.InferenceEngineImpl 调用。
    // 不声明 externalNativeBuild 时，RN 会注入它自己的默认 CMakeLists，
    // appmodules（含 AsyncStorage 等 autolinked TurboModule）正常构建 → 不崩。
    defaultConfig {
        // 正式版用独立 applicationId，与内部测试包（com.co3）**共存不冲突**：
        // 测试机上的旧包不会被覆盖，两者可同时安装、各自保留数据。
        // 注意：只改 applicationId，不改 namespace（namespace 是源码包名 com.co3），
        // Android 允许两者不同。
        applicationId "com.anglesgirl.co3"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        // 正式版标识：加 ECH 标记，与内部测试包（B0.0.xx）区分
        versionName "1.0.0-ech"
    }

    splits {
        abi {
            enable enableSplits
            reset()
            include(*abisToBuild)
            universalApk universalOnly
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86": 3, "x86_64": 4]
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                output.versionCodeOverride = variant.versionCode * 10 + abiCodes.get(abi, 0)
            } else {
                // universal: 10 * %c + 0
                output.versionCodeOverride = variant.versionCode * 10
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "androidx.work:work-runtime:2.11.2"
    implementation "androidx.lifecycle:lifecycle-process:2.11.0"
    // ECH 传输层：Conscrypt = BoringSSL 的 JSSE provider（in-process，无外挂线程/无本地端口）
    implementation "org.conscrypt:conscrypt-android:2.7.0"
    // DoH：用 OkHttp 官方实现（A/AAAA + TTL 缓存 + bootstrapDnsHosts 钉 IP）
    // 版本与 react-native 0.85.3 依赖的 okhttp 4.9.2 严格对齐，避免 4/5 混用
    implementation "com.squareup.okhttp3:okhttp-dnsoverhttps:4.9.2"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

gradle.projectsEvaluated {
    def codegenTaskPaths = rootProject.subprojects
        .findAll { it.tasks.findByName("generateCodegenArtifactsFromSchema") != null }
        .collect { "${it.path}:generateCodegenArtifactsFromSchema" }

    tasks.matching { it.name.startsWith("configureCMake") || it.name.startsWith("externalNativeBuildClean") }.all { t ->
        t.dependsOn(codegenTaskPaths)
    }
}