apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def requestedAbi  = (project.findProperty("BUILD_ABI") ?: System.getenv("BUILD_ABI"))?.trim()
def allAbis       = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.co3"
    defaultConfig {
        applicationId "com.co3"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "B0.0.20"
    }

    // 关键：debug buildType 中不再单独设置 applicationId
    // 只在 defaultConfig 中统一声明，避免 AgpDecorated 冲突
    
    // AAR 依赖 - 标准 Gradle notation
    dependencies {
        implementation fileTree(dir: 'libs', include: ['*.aar'])
        implementation "org.conscrypt:conscrypt-android:2.7-alpha"
    }

    // 始终强制 ABI splits
    splits {
        include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

gradle.projectsEvaluated {
    tasks.matching { 
        it.name.startsWith("generateCodegenFromSchema") || 
        it.name.startsWith("externalNativeBuildClean") 
    }.all { t -> t.dependsOn(rootProject.subprojects.find { it.tasks.findByName("generateCodegenArtifactsFromSchema") != null ) }
}
