apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def requestedAbi  = (project.findProperty("BUILD_ABI") ?: System.getenv("BUILD_ABI"))?.trim()
def allAbis       = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
def universalOnly = requestedAbi == "universal"
def enableSplits  = !universalOnly
def abisToBuild   = (!universalOnly && requestedAbi)
    ? requestedAbi.split(",").collect { it.trim() }
    : allAbis

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.co3"
    defaultConfig {
        applicationId "com.co3"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "B0.0.20"
    }

    // ========== ECH 集成配置开始 ==========
    
    // AAR 依赖目录 - 相对于 module 根目录
    repositories {
        mavenCentral()
        google()
        // 使用 fileTree 从项目根目录的libs子目录加载 AAR
        // 注意：这在 module-level build.gradle 中，所以要用相对路径
    }
    
    dependencies {
        // 标准方式：从 module 的 libs/ 目录加载所有 .aar
        implementation fileTree(dir: 'libs', include: ['*.aar'])
        implementation "org.conscrypt:conscrypt-android:2.7-alpha"
    }
    
    // ========== ECH 集成配置结束 ==========
    
    // 强制 ABI splits - 避免 186MB universal APK
    splits {
        abi {
            enable enableSplits
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            isUniversalApk = false
        }
    }
    
    // debug build：移除 debug 标识，避免 applicationId 改变
    defaultConfig {
        applicationIdSuffix = null
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            resValue "string", "app_icon", "@mipmap/ic_launcher"
            applicationId = "com.co3"
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

gradle.projectsEvaluated {
    def codegenTaskPaths = rootProject.subprojects
        .findAll { it.tasks.findByName("generateCodegenArtifactsFromSchema") != null }
        .collect { "${it.path}:generateCodegenArtifactsFromSchema" }
    tasks.matching { it.name.startsWith("configureCMake") || it.name.startsWith("externalNativeBuildClean") }.all { t ->
        t.dependsOn(codegenTaskPaths)
    }
}
