apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

react {
    autolinkLibrariesWithApp()
}

// Local repo for the gomobile-built ECH proxy AAR (produced in CI by
// `gomobile bind` into android/app/libs/echproxy.aar).
repositories {
    flatDir { dirs "$projectDir/libs" }
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// The gomobile-built ECH proxy is placed here by android-ech.yml (or locally by
// the developer). When the file is missing, the ech/ Kotlin sources are
// excluded from compilation and the ECH native module is simply not registered
// at runtime via reflection in MainApplication.kt — so the non-ECH workflow
// (android-build.yml) and local builds still succeed.
def echproxyAar = file("$projectDir/libs/echproxy.aar")

def requestedAbi  = (project.findProperty("BUILD_ABI") ?: System.getenv("BUILD_ABI"))?.trim()
def allAbis       = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
def universalOnly = requestedAbi == "universal"
def enableSplits  = !universalOnly
def abisToBuild   = (!universalOnly && requestedAbi)
    ? requestedAbi.split(",").collect { it.trim() }
    : allAbis

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.xiaoyaco3"
    defaultConfig {
        applicationId "com.xiaoyaco3"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "B0.0.20"
    }

    splits {
        abi {
            enable enableSplits
            reset()
            include(*abisToBuild)
            universalApk universalOnly
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86": 3, "x86_64": 4]
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                output.versionCodeOverride = variant.versionCode * 10 + abiCodes.get(abi, 0)
            } else {
                // universal: 10 * %c + 0
                output.versionCodeOverride = variant.versionCode * 10
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // When there's no prebuilt echproxy.aar, skip the ECH module sources entirely
    // (they reference Go-generated classes shipped inside the AAR and would fail
    // to compile). MainApplication.kt uses reflection to register EchProxyPackage
    // only when the class is present on the classpath at runtime.
    sourceSets {
        main {
            java {
                if (!echproxyAar.exists()) {
                    exclude 'com/xiaoyaco3/ech/**'
                }
            }
        }
    }
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "androidx.work:work-runtime:2.9.0"
    implementation "androidx.lifecycle:lifecycle-process:2.8.7"

    // gomobile-built ECH proxy (android/app/libs/echproxy.aar). Generated in CI
    // by `gomobile bind`. Only declare the dependency when the file is present
    // so non-ECH CI builds and local development still compile.
    if (echproxyAar.exists()) {
        implementation(name: 'echproxy', ext: 'aar')
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

gradle.projectsEvaluated {
    def codegenTaskPaths = rootProject.subprojects
        .findAll { it.tasks.findByName("generateCodegenArtifactsFromSchema") != null }
        .collect { "${it.path}:generateCodegenArtifactsFromSchema" }

    tasks.matching { it.name.startsWith("configureCMake") || it.name.startsWith("externalNativeBuildClean") }.all { t ->
        t.dependsOn(codegenTaskPaths)
    }
}
