plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android { namespace 'com.co3.echtester'; compileSdk 36
    defaultConfig { applicationId 'com.co3.echtester'; minSdk 24; targetSdk 35; versionCode 1; versionName '1.0' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin { jvmToolchain(17) }

dependencies { implementation(name: 'echproxy', ext: 'aar') }
